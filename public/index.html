<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PPC Reports</title>
<style>
  :root{color-scheme:light;--page:#eef0f2;--surface:#fcfcfb;--ink:#0f1214;--ink2:#4b5259;--rule:#dfe2e5;--accent:#2a78d6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  main{max-width:720px;margin:0 auto;padding:40px 16px}
  h1{font-size:28px;line-height:1.15;margin:0}
  .sub{color:var(--ink2);margin:6px 0 24px}
  .cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  a.card{display:block;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px;color:inherit;text-decoration:none}
  a.card:hover,a.card:focus-visible{border-color:var(--accent)}
  a.card b{display:block;font-size:17px;margin-bottom:4px}
  a.card span{color:var(--ink2)}
  .pub{margin-top:24px;color:var(--ink2);font-size:13px}
  .pub a{color:inherit}
</style>
</head>
<body>
<main>
  <h1>PPC Reports</h1>
  <p class="sub">Polymer Products Co LLC</p>
  <div class="cards">
    <a class="card" href="explorer.html"><b>Rope Production Explorer</b><span>Rope winding, extruder, sales, and produced against sold.</span></a>
    <a class="card" href="dashboard.html"><b>PPC Sales Dashboard</b><span>Sales by month and customer, with every invoice and line item.</span></a>
  </div>
  <p class="pub">Publishing new figures? Open the <a href="explorer.html?publisher">Explorer</a> or the <a href="dashboard.html?publisher">Dashboard</a> in publisher mode.</p>
</main>
</body>
</html>
